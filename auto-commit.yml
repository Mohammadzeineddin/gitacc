name: Auto Commit Bot

on:
  schedule:
    # Runs at 12:00 AM UTC every day. You can adjust the cron schedule.
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to trigger it manually

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Make an arbitrary change
        run: |
          echo "Automated commit on $(date)" >> commit_log.txt
          
      - name: Commit and Push
        run: |
          git config --global user.name "Your GitHub Username"
          git config --global user.email "your-github-email@example.com"
          git add commit_log.txt
          git commit -m "Automated daily activity"
          git push
